[project]
name = "relay-m0"
version = "0.0.0"
description = "Relay M0 real-service infrastructure compatibility gates"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.107",
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "SQLAlchemy==2.1.1",
    "alembic==1.20.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
