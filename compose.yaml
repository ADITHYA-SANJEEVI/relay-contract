name: relay-m0
services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: relay_m0
      POSTGRES_USER: relay_m0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate ignored .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54328}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_m0 -d relay_m0"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: relay-m0-minio:RELEASE.2025-10-15T17-29-55Z
    platform: linux/amd64
    build:
      context: infra/minio
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_ACCESS_KEY:?Generate ignored .env first}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_SECRET_KEY:?Generate ignored .env first}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio-setup:
    image: relay-m0-minio:RELEASE.2025-10-15T17-29-55Z
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_ACCESS_KEY:?Generate ignored .env first}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_SECRET_KEY:?Generate ignored .env first}
      S3_RUNTIME_ACCESS_KEY: ${S3_RUNTIME_ACCESS_KEY:?Generate ignored .env first}
      S3_RUNTIME_SECRET_KEY: ${S3_RUNTIME_SECRET_KEY:?Generate ignored .env first}
      S3_BUCKET: ${S3_BUCKET:-relay-m0-contract}
    volumes:
      - ./infra/minio/setup.sh:/setup/setup.sh:ro
volumes:
  postgres-data:
  minio-data:
